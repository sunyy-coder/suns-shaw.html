<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You are Peppa Pig! 🐷</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mali:wght@500;700&display=swap');

    body {
      font-family: 'Fredoka', cursive, sans-serif;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #ff4d6d 0%, #ffb703 50%, #ff85a1 100%);
      height: 100vh;
      user-select: none;
      touch-action: manipulation;
    }

    /* Peppa-style bouncy text & buttons */
    .font-peppa {
      font-family: 'Fredoka', cursive;
    }

    .font-mali {
      font-family: 'Mali', cursive;
    }

    .text-shadow-peppa {
      text-shadow: 4px 4px 0px #be123c, -2px -2px 0px #fef08a;
    }

    .text-shadow-yellow {
      text-shadow: 3px 3px 0px #b45309;
    }

    .peppa-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 6px solid #ff2e63;
      box-shadow: 0 20px 40px rgba(190, 18, 60, 0.35), inset 0 0 15px rgba(255, 182, 193, 0.5);
    }

    .peppa-btn {
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 8px 0px #9f1239, 0 15px 20px rgba(0,0,0,0.2);
    }

    .peppa-btn:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 12px 0px #9f1239, 0 20px 25px rgba(0,0,0,0.25);
    }

    .peppa-btn:active {
      transform: translateY(4px) scale(0.97);
      box-shadow: 0 2px 0px #9f1239, 0 5px 10px rgba(0,0,0,0.15);
    }

    .peppa-btn-yellow {
      box-shadow: 0 8px 0px #b45309, 0 15px 20px rgba(0,0,0,0.2);
    }
    .peppa-btn-yellow:hover {
      box-shadow: 0 12px 0px #b45309, 0 20px 25px rgba(0,0,0,0.25);
    }
    .peppa-btn-yellow:active {
      box-shadow: 0 2px 0px #b45309, 0 5px 10px rgba(0,0,0,0.15);
    }

    /* Floating animation keyframes */
    @keyframes floatBounce {
      0%, 100% { transform: translateY(0px) rotate(-2deg); }
      50% { transform: translateY(-16px) rotate(2deg); }
    }

    @keyframes pulseSnout {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12) rotate(5deg); }
    }

    .animate-bounce-gentle {
      animation: floatBounce 3.5s ease-in-out infinite;
    }

    .animate-snout {
      animation: pulseSnout 2s ease-in-out infinite;
    }

    /* Custom range slider styling */
    input[type=range] {
      -webkit-appearance: none;
      background: #fecdd3;
      height: 12px;
      border-radius: 6px;
      border: 2px solid #f43f5e;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #ff2e63;
      border: 3px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    /* Canvas background overlay */
    #emojiCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: pointer;
    }
  </style>
</head>
<body class="relative flex items-center justify-center min-h-screen overflow-hidden">

  <!-- Canvas for Floating Emojis & Interactive Explosions -->
  <canvas id="emojiCanvas"></canvas>

  <!-- Main Peppa Pig Card UI -->
  <main class="relative z-10 w-11/12 max-w-xl p-6 md:p-8 rounded-3xl peppa-card text-center my-auto transition-all duration-300">
    
    <!-- Cute Piggy Nose Header Badge -->
    <div class="mx-auto w-20 h-14 md:w-24 md:h-16 bg-pink-400 rounded-full border-4 border-pink-100 flex items-center justify-center gap-3 mb-4 shadow-lg animate-snout cursor-pointer" onclick="triggerOinkSound(); triggerPiggyBurst();" title="Click me for a surprise!">
      <div class="w-3.5 h-5 bg-pink-600 rounded-full shadow-inner"></div>
      <div class="w-3.5 h-5 bg-pink-600 rounded-full shadow-inner"></div>
    </div>

    <!-- Title Banner -->
    <div class="animate-bounce-gentle">
      <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold text-pink-500 tracking-wide text-shadow-peppa uppercase">
        You are <br><span class="text-yellow-300 text-shadow-yellow text-5xl sm:text-6xl md:text-7xl">Peppa Pig!</span> 🐷
      </h1>
      
      <!-- Vivid Red, Yellow, Pink Emoji Row -->
      <div class="flex justify-center items-center gap-2 sm:gap-3 text-2xl sm:text-3xl my-3 py-1 bg-yellow-200/80 rounded-full border-2 border-yellow-400 max-w-md mx-auto shadow-sm">
        <span class="hover:scale-125 transition-transform cursor-pointer">❤️</span>
        <span class="hover:scale-125 transition-transform cursor-pointer">💛</span>
        <span class="hover:scale-125 transition-transform cursor-pointer">🩷</span>
        <span class="hover:scale-125 transition-transform cursor-pointer">👑</span>
        <span class="hover:scale-125 transition-transform cursor-pointer">✨</span>
        <span class="hover:scale-125 transition-transform cursor-pointer">🌸</span>
        <span class="hover:scale-125 transition-transform cursor-pointer">🎈</span>
      </div>
    </div>

    <p class="text-base sm:text-lg font-mali font-bold text-rose-700 mt-2 mb-6">
      Oink! Oink! Tap anywhere to splash floating colorful emojis! 🎨
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-wrap justify-center gap-3 sm:gap-4 mb-6">
      <button onclick="triggerBigExplosion()" class="peppa-btn bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-6 rounded-2xl text-base sm:text-lg flex items-center gap-2 border-2 border-rose-300">
        <span>🎉 Emoji Blast!</span>
      </button>

      <button onclick="toggleAudio()" id="audioBtn" class="peppa-btn peppa-btn-yellow bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold py-3 px-5 rounded-2xl text-base sm:text-lg flex items-center gap-2 border-2 border-amber-200">
        <i class="fa-solid fa-volume-high" id="soundIcon"></i>
        <span id="soundLabel">Sound On</span>
      </button>

      <button onclick="toggleControls()" class="peppa-btn bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 px-5 rounded-2xl text-base sm:text-lg flex items-center gap-2 border-2 border-pink-200">
        <i class="fa-solid fa-sliders"></i>
        <span>Settings</span>
      </button>
    </div>

    <!-- Collapsible Settings Panel -->
    <div id="settingsPanel" class="hidden mt-4 p-4 bg-pink-100/90 rounded-2xl border-2 border-pink-300 text-left text-sm font-mali text-rose-900 space-y-3 shadow-inner">
      <div class="flex items-center justify-between">
        <label class="font-bold flex items-center gap-1">🎈 Emoji Speed</label>
        <input type="range" id="speedSlider" min="1" max="10" value="4" class="w-1/2">
      </div>

      <div class="flex items-center justify-between">
        <label class="font-bold flex items-center gap-1">✨ Floating Count</label>
        <input type="range" id="countSlider" min="10" max="100" value="45" class="w-1/2">
      </div>

      <div class="flex items-center justify-between">
        <label class="font-bold">🎨 Primary Color Theme</label>
        <div class="flex gap-2">
          <button onclick="setThemeFilter('all')" class="px-2 py-1 bg-white rounded border border-rose-400 text-xs font-bold hover:bg-rose-100">All ❤️💛🩷</button>
          <button onclick="setThemeFilter('red')" class="px-2 py-1 bg-red-500 text-white rounded text-xs font-bold hover:opacity-90">Red ❤️</button>
          <button onclick="setThemeFilter('yellow')" class="px-2 py-1 bg-yellow-400 text-amber-950 rounded text-xs font-bold hover:opacity-90">Yellow 💛</button>
          <button onclick="setThemeFilter('pink')" class="px-2 py-1 bg-pink-400 text-white rounded text-xs font-bold hover:opacity-90">Pink 🩷</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Floating Audio Canvas Listener -->
  <script>
    // Canvas & Context Setup
    const canvas = document.getElementById('emojiCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initFloatingEmojis();
    });

    // Theme Color Palettes & Emoji Collections
    const EMOJI_SETS = {
      red: ['❤️', '🎈', '🌹', '🍓', '🍎', '👑'],
      yellow: ['💛', '✨', '⭐', '👑', '🐥', '🌼'],
      pink: ['🩷', '🐷', '🌸', '💖', '🎀', '🐽'],
      all: ['❤️', '💛', '🩷', '🐷', '👑', '✨', '🌸', '🎈', '🐽', '⭐', '💖']
    };

    let activeFilter = 'all';
    let soundEnabled = true;

    // Settings Parameters
    let speedMultiplier = 1;
    let targetEmojiCount = 45;

    // Dynamic Lists for Rendering
    let floatingEmojis = [];
    let particleExplosions = [];

    // Sound Synthesizer via Web Audio API (No External Audio Asset dependencies)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playPopSound(freq = 440, type = 'sine', duration = 0.15) {
      if (!soundEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.8, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.log("Audio play error", e);
      }
    }

    function triggerOinkSound() {
      if (!soundEnabled) return;
      try {
        initAudio();
        // Playful double-pitch 'oink' sound synth
        playPopSound(220, 'sawtooth', 0.12);
        setTimeout(() => playPopSound(310, 'sawtooth', 0.15), 100);
      } catch(e){}
    }

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('soundIcon');
      const label = document.getElementById('soundLabel');
      if (soundEnabled) {
        icon.className = 'fa-solid fa-volume-high';
        label.innerText = 'Sound On';
        playPopSound(520, 'sine', 0.1);
      } else {
        icon.className = 'fa-solid fa-volume-xmark';
        label.innerText = 'Muted';
      }
    }

    // Floating Emoji Particle Class
    class FloatingEmoji {
      constructor() {
        this.reset(true);
      }

      reset(initial = false) {
        const pool = EMOJI_SETS[activeFilter] || EMOJI_SETS.all;
        this.emoji = pool[Math.floor(Math.random() * pool.length)];
        this.x = Math.random() * width;
        this.y = initial ? Math.random() * height : height + 30;
        this.size = Math.random() * 26 + 22; // 22px to 48px
        this.baseSpeedY = (Math.random() * 1.5 + 0.8);
        this.speedY = this.baseSpeedY;
        this.oscillation = Math.random() * Math.PI * 2;
        this.oscillationSpeed = Math.random() * 0.03 + 0.01;
        this.swayWidth = Math.random() * 2 + 0.5;
        this.opacity = Math.random() * 0.5 + 0.5;
        this.rotation = (Math.random() - 0.5) * 0.4;
      }

      update() {
        this.y -= this.speedY * speedMultiplier;
        this.oscillation += this.oscillationSpeed;
        this.x += Math.sin(this.oscillation) * this.swayWidth;

        // Respawn when top edge reached
        if (this.y < -50) {
          this.reset(false);
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.font = `${this.size}px Fredoka, sans-serif`;
        ctx.translate(this.x, this.y);
        ctx.rotate(Math.sin(this.oscillation) * 0.2);
        ctx.fillText(this.emoji, 0, 0);
        ctx.restore();
      }
    }

    // Explosion Particle for Clicks/Taps
    class BurstParticle {
      constructor(x, y, emoji) {
        this.x = x;
        this.y = y;
        this.emoji = emoji;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 3;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 2;
        this.gravity = 0.2;
        this.size = Math.random() * 24 + 20;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.015;
        this.rotation = Math.random() * Math.PI;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.life -= this.decay;
        this.rotation += this.rotSpeed;
      }

      draw() {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.font = `${this.size}px Fredoka, sans-serif`;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillText(this.emoji, -this.size / 2, this.size / 2);
        ctx.restore();
      }
    }

    function initFloatingEmojis() {
      floatingEmojis = [];
      for (let i = 0; i < targetEmojiCount; i++) {
        floatingEmojis.push(new FloatingEmoji());
      }
    }

    // User Interactive Click & Touch Spawner
    function createBurstAt(x, y, count = 12) {
      const pool = EMOJI_SETS[activeFilter] || EMOJI_SETS.all;
      for (let i = 0; i < count; i++) {
        const randomEmoji = pool[Math.floor(Math.random() * pool.length)];
        particleExplosions.push(new BurstParticle(x, y, randomEmoji));
      }
      playPopSound(350 + Math.random() * 250, 'sine', 0.12);
    }

    // Trigger Big Explosion from Central Button
    function triggerBigExplosion() {
      const centerX = width / 2;
      const centerY = height / 2;
      for (let i = 0; i < 4; i++) {
        setTimeout(() => {
          createBurstAt(
            centerX + (Math.random() - 0.5) * 200,
            centerY + (Math.random() - 0.5) * 200,
            15
          );
        }, i * 80);
      }
    }

    function triggerPiggyBurst() {
      createBurstAt(width / 2, height / 2 - 50, 25);
    }

    // Canvas Mouse Click Handling
    window.addEventListener('pointerdown', (e) => {
      // Avoid triggering when clicking interactive buttons
      if (e.target.closest('button') || e.target.closest('input') || e.target.closest('#settingsPanel')) {
        return;
      }
      createBurstAt(e.clientX, e.clientY, 10);
    });

    // Control UI Event Handlers
    function toggleControls() {
      const panel = document.getElementById('settingsPanel');
      panel.classList.toggle('hidden');
      playPopSound(400, 'triangle', 0.08);
    }

    function setThemeFilter(filter) {
      activeFilter = filter;
      initFloatingEmojis();
      playPopSound(600, 'sine', 0.1);
    }

    document.getElementById('speedSlider').addEventListener('input', (e) => {
      speedMultiplier = parseFloat(e.target.value) / 4;
    });

    document.getElementById('countSlider').addEventListener('input', (e) => {
      targetEmojiCount = parseInt(e.target.value);
      initFloatingEmojis();
    });

    // Main Animation Loop
    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Render Floating Emojis
      for (let i = 0; i < floatingEmojis.length; i++) {
        floatingEmojis[i].update();
        floatingEmojis[i].draw();
      }

      // Render Burst Explosions
      for (let i = particleExplosions.length - 1; i >= 0; i--) {
        particleExplosions[i].update();
        particleExplosions[i].draw();
        if (particleExplosions[i].life <= 0) {
          particleExplosions.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    // Start App & Animation
    window.onload = () => {
      initFloatingEmojis();
      animate();
    };
  </script>
</body>
</html>
